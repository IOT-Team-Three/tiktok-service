

#开发环境
spring:
  # ai配置
  ai:
    ollama:
      chat:
        options:
          model: deepseek-r1:8b
      embedding:
        enabled: true
        model: all-minilm
      base-url: http://localhost:11434

  #文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB
      file-size-threshold: 1MB
      location: ./temp

  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/user?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      auto-commit: false
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
      connection-timeout: 20000
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 900000
      pool-name: TikTokHikariPool
  # redis配置
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: 123456
      database: 0
      connect-timeout: PT20S
      timeout: PT5S
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: PT20S

# MyBatis-plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.iot.entity

# 日志配置
logging:
  level:
    com.sicau: DEBUG
    org.springframework.jdbc: DEBUG

# 应用配置
app:
  base-url: "http://localhost:${server.port}${server.servlet.context-path}"
  home-url: "${app.base-url}/home"

# cas服务器配置
cas:
  server-url: https://auth.sicau.cn/sso/
  callback-url: "${app.base-url}/login/callback"
  client-name: casClient
  app-id: ${cas.client-name}

# 安全配置
security:
  open-url: /api/v1/auth/login,/api/v1/auth/register

jwt:
  secret: "12345678901234567890123456789012"
  expiration: 3600000
  token-header: "Authorization"
  token-prefix: "Bearer "

default:
  avatar: https://i0.hdslb.com/bfs/note/4b3f75f2c3e8cd8390b7304b3f9d95702f270baf.png