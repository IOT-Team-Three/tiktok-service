[supervisord]
nodaemon=true ; 不守护进程
logfile=/dev/stdout ; 日志输出到 stdout
pidfile=/tmp/run/supervisord.pid ; 进程 ID 文件
childlogdir=/tmp/log/supervisord ; 子进程日志目录

[program:mysql]
command=/usr/sbin/mysqld --daemonize=no ; 启动 MySQL 服务（非守护进程模式）
user=root ; 运行 MySQL 服务的用户
autostart=true ; 自动启动 MySQL 服务
autorestart=true ; 自动重启 MySQL 服务
startretries=3 ; 启动重试次数
stderr_logfile=/tmp/log/supervisord/mysql.stderr.log ; 错误日志输出目录
stdout_logfile=/tmp/log/supervisord/mysql.stdout.log ; 标准输出日志输出目录
stdout_logfile_maxbytes=1MB ; 标准输出日志最大字节数
stdout_logfile_backups=10 ; 标准输出日志备份数量

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf ; 启动 Redis 服务
user=redis ; 运行 Redis 服务的用户
autostart=true ; 自动启动 Redis 服务
autorestart=true ; 自动重启 Redis 服务
stderr_logfile=/tmp/log/supervisord/redis.stderr.log ; 错误日志输出目录
stdout_logfile=/tmp/log/supervisord/redis.stdout.log ; 标准输出日志输出目录
stdout_logfile_maxbytes=1MB ; 标准输出日志最大字节数
stdout_logfile_backups=10 ; 标准输出日志备份数量

[program:ollama-server]
command=ollama serve ; 启动 Ollama 服务器
user=root ; 运行 Ollama 服务的用户
autostart=true ; 自动启动 Ollama 服务
autorestart=true ; 自动重启 Ollama 服务
stderr_logfile=/tmp/log/supervisord/ollama-server.stderr.log ; 错误日志输出目录
stdout_logfile=/tmp/log/supervisord/ollama-server.stdout.log ; 标准输出日志输出目录
stdout_logfile_maxbytes=1MB ; 标准输出日志最大字节数
stdout_logfile_backups=10 ; 标准输出日志备份数量
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"  ; 指定环境变量

[program:ollama-model]
command=bash -c "sleep 10 && ollama run deepseek-r1:8b" ; 等待服务器启动后运行模型
user=root ; 运行 Ollama 模型的用户
autostart=true ; 自动启动 Ollama 模型
autorestart=true ; 自动重启 Ollama 模型
stderr_logfile=/tmp/log/supervisord/ollama-model.stderr.log ; 错误日志输出目录
stdout_logfile=/tmp/log/supervisord/ollama-model.stdout.log ; 标准输出日志输出目录
stdout_logfile_maxbytes=1MB ; 标准输出日志最大字节数
stdout_logfile_backups=10 ; 标准输出日志备份数量
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"  ; 指定环境变量

[program:spring-boot]
command=java -jar /opt/app/app.jar ; 启动 Spring Boot 应用
user=root ; 运行 Spring Boot 应用的用户
autostart=true ; 自动启动 Spring Boot 应用
autorestart=true ; 自动重启 Spring Boot 应用
startretries=3 ; 启动重试次数
stderr_logfile=/tmp/log/supervisord/spring-boot.stderr.log ; 错误日志输出目录
stdout_logfile=/tmp/log/supervisord/spring-boot.stdout.log ; 标准输出日志输出目录
stdout_logfile_maxbytes=1MB ; 标准输出日志最大字节数
stdout_logfile_backups=10 ; 标准输出日志备份数量
startsecs=30 ; 启动后等待30秒确认服务正常